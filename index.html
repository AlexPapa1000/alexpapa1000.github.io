<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy Physics: Catch Puzzle</title>
<meta name="description" content="Toy Physics: Catch Puzzle, a physics puzzle game for iPhone, iPad and Android.">
<link rel="icon" href="icon.png">
<meta property="og:title" content="Toy Physics: Catch Puzzle">
<meta property="og:description" content="Pack the toys. Share the magic.">
<meta property="og:image" content="https://alexpapa1000.github.io/banner.jpg">
<style>
  :root { --bg: #fdf8f0; --fg: #2b2118; --muted: #6b5d50; --link: #b5481f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1814; --fg: #f3ece2; --muted: #b3a697; --link: #f08a5d; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .banner { display: block; width: 100%; max-height: 420px; object-fit: cover; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; gap: 16px; margin: 0 0 32px; }
  header img { width: 80px; height: 80px; border-radius: 18px; flex: none; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 12px; }
  a { color: var(--link); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<img class="banner" src="banner.jpg" alt="The toymaker in his workshop: Pack the toys. Share the magic.">
<main>
  <header>
    <img src="icon.png" alt="Toy Physics app icon">
    <div>
      <h1>Toy Physics: Catch Puzzle</h1>
      <p>A physics puzzle game for iPhone, iPad and Android.</p>
    </div>
  </header>
  <ul>
    <li><a href="https://apps.apple.com/us/app/toy-physics-catch-puzzle/id6809115657">Download on the App Store</a></li>
    <li><a href="https://sites.google.com/view/toyphysicshelp">Support</a></li>
    <li><a href="https://sites.google.com/view/toyphysics">Privacy Policy</a></li>
  </ul>
</main>
</body>
</html>
